{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Veterinary Clinic{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'clinic/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar navbar-expand-lg header-inner" aria-label="Primary navigation">
            <a class="navbar-brand brand" href="{% url 'home' %}"><span class="brand-mark" aria-hidden="true">V</span>Veterinary Clinic</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#primary-navigation" aria-controls="primary-navigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="primary-navigation">
                <div class="site-nav navbar-nav">
                    <a class="nav-link" href="{% url 'client-list' %}">Clients</a>
                    <a class="nav-link" href="{% url 'appointment-list' %}">Appointments</a>
                </div>
            </div>
        </nav>
    </header>
    <main class="main-shell">
        {% if messages %}
        <ul class="messages alert alert-success" role="status" aria-live="polite">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
